name: 'Flutter Continuous Integration'

on:
  pull_request:
    paths:
      - 'flutter/**/*'

jobs:
  analyze-and-test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Dart/Flutter unit + widget tests
        # `flutter test` isn't workspace-aware — it only looks for a `test/` directory in the
        # working directory it's run from — so each workspace member needs its own invocation.
        run: |
          for pkg in flutter-sdk-bridge/ping_core flutter-sdk-bridge/ping_journey flutter-sdk-bridge/ping_oidc flutter-journey; do
            echo "::group::flutter test ($pkg)"
            (cd "$pkg" && flutter test)
            echo "::endgroup::"
          done

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # The native SDK AARs ship Java 21 bytecode, which the unit tests load directly.
          java-version: '21'

      - name: Android unit tests (ping_core, ping_journey, ping_oidc)
        # The Gradle wrapper is gitignored in Flutter app projects; `--config-only` generates it.
        working-directory: flutter/flutter-journey
        run: |
          flutter build apk --config-only
          cd android && ./gradlew :ping_core:testDebugUnitTest :ping_journey:testDebugUnitTest :ping_oidc:testDebugUnitTest
