name: ping_davinci_example
description: "Integration-test host for the ping_davinci bridge package. Not a sample app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

resolution: workspace

# This package exists to host `ping_davinci`'s integration tests. Flutter's `integration_test`
# package can only run from an application package, so a plugin needs a host app to exercise its
# platform channels against real native code. It deliberately has no UI worth speaking of — the
# tests drive the module's Dart API directly and never touch the widget tree.
#
# It is NOT a sample app. The samples live at `flutter/flutter-journey`, `flutter/flutter-oidc`,
# and (once it exists) `flutter/flutter-davinci`; those demonstrate usage and ship no tests.

dependencies:
  flutter:
    sdk: flutter
  ping_davinci:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
