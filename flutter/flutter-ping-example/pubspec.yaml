name: ping_example
description: "Ping Journey, DaVinci and OIDC in one Flutter app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  ping_journey:
    path: ../flutter-sdk-bridge/ping_journey
  ping_davinci:
    path: ../flutter-sdk-bridge/ping_davinci
  ping_oidc:
    path: ../flutter-sdk-bridge/ping_oidc
  provider: ^6.1.5
  go_router: ^16.2.4
  shared_preferences: ^2.5.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/ping_logo.png
